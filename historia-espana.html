<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historia de España — Temas Increíbles</title>
  <style>
    :root {
      --rojo: #c0392b;
      --amarillo: #f39c12;
      --dorado: #d4a017;
      --fondo: #1a1a2e;
      --fondo2: #16213e;
      --fondo3: #0f3460;
      --texto: #eaeaea;
      --subtexto: #a0a0b8;
      --card: #1e2a4a;
      --card-hover: #253561;
      --borde: #2e3f6f;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Georgia', serif;
      background: var(--fondo);
      color: var(--texto);
      min-height: 100vh;
    }

    /* HEADER */
    header {
      background: linear-gradient(135deg, var(--rojo) 0%, #8b0000 40%, var(--fondo3) 100%);
      padding: 2.5rem 2rem 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
      border-bottom: 3px solid var(--dorado);
    }
    header::before {
      content: '⚜';
      position: absolute;
      top: 50%;
      left: 3rem;
      transform: translateY(-50%);
      font-size: 4rem;
      opacity: 0.15;
    }
    header::after {
      content: '⚜';
      position: absolute;
      top: 50%;
      right: 3rem;
      transform: translateY(-50%);
      font-size: 4rem;
      opacity: 0.15;
    }
    header h1 {
      font-size: 2.4rem;
      font-weight: bold;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
    }
    header p {
      margin-top: 0.5rem;
      color: #ffd700;
      font-style: italic;
      font-size: 1rem;
      opacity: 0.9;
    }

    /* BARRA DE BÚSQUEDA */
    .search-container {
      background: var(--fondo2);
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--borde);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .search-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }
    #buscador {
      flex: 1;
      min-width: 200px;
      padding: 0.75rem 1.2rem;
      font-size: 1rem;
      border-radius: 8px;
      border: 2px solid var(--borde);
      background: var(--fondo3);
      color: var(--texto);
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }
    #buscador:focus { border-color: var(--dorado); }
    #buscador::placeholder { color: var(--subtexto); }

    .filtros {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .filtro-btn {
      padding: 0.4rem 0.9rem;
      border-radius: 20px;
      border: 1px solid var(--borde);
      background: var(--fondo3);
      color: var(--subtexto);
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
      font-family: inherit;
    }
    .filtro-btn:hover, .filtro-btn.activo {
      background: var(--dorado);
      color: #1a1a2e;
      border-color: var(--dorado);
      font-weight: bold;
    }

    /* ESTADÍSTICAS */
    .stats {
      max-width: 900px;
      margin: 1rem auto 0;
      padding: 0 2rem;
      color: var(--subtexto);
      font-size: 0.85rem;
    }
    #contador { color: var(--dorado); font-weight: bold; }

    /* GRID DE CARDS */
    .grid {
      max-width: 900px;
      margin: 1.5rem auto 3rem;
      padding: 0 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 1.2rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--borde);
      border-radius: 12px;
      padding: 1.4rem;
      cursor: pointer;
      transition: all 0.25s;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 4px;
      height: 100%;
      background: var(--dorado);
      opacity: 0;
      transition: opacity 0.25s;
    }
    .card:hover {
      background: var(--card-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      border-color: var(--dorado);
    }
    .card:hover::before { opacity: 1; }

    .card-header {
      display: flex;
      align-items: flex-start;
      gap: 0.8rem;
      margin-bottom: 0.7rem;
    }
    .card-emoji { font-size: 1.8rem; flex-shrink: 0; }
    .card-titulo {
      font-size: 1.05rem;
      font-weight: bold;
      color: #fff;
      line-height: 1.3;
    }
    .card-fecha {
      font-size: 0.78rem;
      color: var(--dorado);
      margin-top: 0.25rem;
      font-style: italic;
    }

    .card-descripcion {
      font-size: 0.88rem;
      color: var(--subtexto);
      line-height: 1.6;
      margin-bottom: 0.8rem;
    }

    .card-tags {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .tag {
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      font-size: 0.72rem;
      font-weight: bold;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .tag-era {
      background: rgba(192, 57, 43, 0.25);
      color: #e74c3c;
      border: 1px solid rgba(192, 57, 43, 0.4);
    }
    .tag-cat {
      background: rgba(212, 160, 23, 0.2);
      color: var(--dorado);
      border: 1px solid rgba(212, 160, 23, 0.35);
    }

    /* MODAL DE DETALLE */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.visible { display: flex; }
    .modal {
      background: var(--fondo2);
      border: 1px solid var(--borde);
      border-top: 3px solid var(--dorado);
      border-radius: 14px;
      max-width: 640px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 2rem;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
    }
    .modal-close {
      position: absolute;
      top: 1rem; right: 1rem;
      background: none;
      border: none;
      color: var(--subtexto);
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s;
    }
    .modal-close:hover { color: var(--rojo); }
    .modal-emoji { font-size: 3rem; margin-bottom: 0.5rem; }
    .modal-titulo {
      font-size: 1.5rem;
      font-weight: bold;
      color: #fff;
      margin-bottom: 0.3rem;
    }
    .modal-fecha {
      color: var(--dorado);
      font-style: italic;
      margin-bottom: 1rem;
    }
    .modal-descripcion {
      color: var(--texto);
      line-height: 1.8;
      font-size: 0.95rem;
      margin-bottom: 1.2rem;
    }
    .modal-detalle {
      color: var(--subtexto);
      line-height: 1.8;
      font-size: 0.9rem;
      border-top: 1px solid var(--borde);
      padding-top: 1rem;
    }
    .modal-detalle h4 {
      color: var(--dorado);
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* SIN RESULTADOS */
    .sin-resultados {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--subtexto);
      grid-column: 1 / -1;
    }
    .sin-resultados span { font-size: 3rem; display: block; margin-bottom: 1rem; }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 2rem;
      border-top: 1px solid var(--borde);
      color: var(--subtexto);
      font-size: 0.82rem;
    }

    @media (max-width: 600px) {
      header h1 { font-size: 1.6rem; }
      .grid { grid-template-columns: 1fr; padding: 0 1rem; }
      .search-inner { padding: 0; }
    }
  </style>
</head>
<body>

<header>
  <h1>⚔️ Historia de España</h1>

<div class="search-container">

  </div>

<div class="stats">

<div class="grid" id="grid"></div>

<div class="modal-overlay" id="modalOverlay">

<footer>

// Estado
let filtroActivo = 'Todos';
let busqueda = '';

// Extraer eras únicas
const eras = ['Todos', ...new Set(TEMAS.map(t => t.era))];

// Renderizar filtros
function renderFiltros() {
  const cont = document.getElementById('filtros');
  cont.innerHTML = eras.map(era =>
    `<button class="filtro-btn ${era === filtroActivo ? 'activo' : ''}"
      onclick="setFiltro('${era}')">${era}</button>`
  ).join('');
}

function setFiltro(era) {
  filtroActivo = era;
  renderFiltros();
  renderGrid();
}

// Filtrar temas
function filtrar() {
  const q = busqueda.toLowerCase();
  return TEMAS.filter(t => {
    const matchFiltro = filtroActivo === 'Todos' || t.era === filtroActivo;
    const matchBusqueda = !q ||
      t.titulo.toLowerCase().includes(q) ||
      t.desc.toLowerCase().includes(q) ||
      t.detalle.toLowerCase().includes(q) ||
      t.categoria.toLowerCase().includes(q) ||
      t.era.toLowerCase().includes(q) ||
      t.etiqueta.toLowerCase().includes(q) ||
      t.fecha.toLowerCase().includes(q);
    return matchFiltro && matchBusqueda;
  });
}

// Resaltar texto
function resaltar(texto, q) {
  if (!q) return texto;
  const regex = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  return texto.replace(regex, '<mark style="background:#d4a017;color:#1a1a2e;border-radius:2px;padding:0 2px">$1</mark>');
}

// Renderizar grid
function renderGrid() {
  const temas = filtrar();
  const grid = document.getElementById('grid');
  document.getElementById('contador').textContent = temas.length;

  if (temas.length === 0) {
    grid.innerHTML = `<div class="sin-resultados">
      <span>🔍</span>
      No se encontraron temas para "<strong>${busqueda}</strong>".<br>
      Prueba con otro término.
    </div>`;
    return;
  }

  const q = busqueda.toLowerCase();
  grid.innerHTML = temas.map(t => `
    <div class="card" onclick="abrirModal(${t.id})">
      <div class="card-header">
        <span class="card-emoji">${t.emoji}</span>
        <div>
          <div class="card-titulo">${resaltar(t.titulo, q)}</div>
          <div class="card-fecha">📅 ${t.fecha}</div>
        </div>
      </div>
      <div class="card-descripcion">${resaltar(t.desc.substring(0,160), q)}…</div>
      <div class="card-tags">
        <span class="tag tag-era">${t.era}</span>
        <span class="tag tag-cat">${t.categoria}</span>
      </div>
    </div>
  `).join('');
}

// Modal
function abrirModal(id) {
  const t = TEMAS.find(x => x.id === id);
  if (!t) return;
  document.getElementById('m-emoji').textContent = t.emoji;
  document.getElementById('m-titulo').textContent = t.titulo;
  document.getElementById('m-fecha').textContent = '📅 ' + t.fecha + ' · ' + t.era + ' · ' + t.categoria;
  document.getElementById('m-desc').textContent = t.desc;
  document.getElementById('m-detalle').textContent = t.detalle;
  document.getElementById('modalOverlay').classList.add('visible');
  document.body.style.overflow = 'hidden';
}

function cerrarModal() {
  document.getElementById('modalOverlay').classList.remove('visible');
  document.body.style.overflow = '';
}

// Cerrar modal con Escape o click en overlay
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) cerrarModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') cerrarModal();
});

// Búsqueda en tiempo real
document.getElementById('buscador').addEventListener('input', function() {
  busqueda = this.value.trim();
  renderGrid();
});

// Init
renderFiltros();
renderGrid();
</script>
